# Netlify: publish only the website, not the whole Electron project
[build]
  command = "rm -rf public && mkdir -p public && cp -r index.html 404.html robots.txt sitemap.xml favicon.ico googlee8cab3d0c9db754d.html web public/ && (cp -r dist public/ 2>/dev/null || true)"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/web/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/web/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/dist/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"
