<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gate Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- shared brand gradient used by gate outlines (cyan -> blue -> violet, from the logo) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="geBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="0.55" stop-color="#0A4DFF"/><stop offset="1" stop-color="#3A0CF5"/>
    </linearGradient>
  </defs>
</svg>

<!-- Launcher -->
<section id="welcome" class="welcome">
  <div class="welcome-card">
    <img class="welcome-logo" src="logo.png" alt="">
    <h1>Gate Engine</h1>
    <p class="tagline">Design logic circuits on plates, save them as parts, and run them live.</p>
    <div class="welcome-actions">
      <button class="btn primary lg" data-act="new-project">New project</button>
      <button class="btn lg" data-act="open-project">Open project</button>
    </div>
    <div class="recent">
      <h2>Your projects</h2>
      <div id="recentList" class="recent-list"></div>
    </div>
  </div>
</section>

<div class="credit welcome-credit" data-ext="https://www.linkedin.com/in/cvaki-" role="link" tabindex="0" title="Open CVAKI on LinkedIn"><img src="cvaki.png" alt=""><span>Dev <b>CVAKI</b></span></div>

<!-- IDE -->
<div id="ide" class="ide hidden">
  <header class="topbar">
    <div class="tb-left">
      <div class="brand"><img src="logo.png" alt=""><span class="brand-name">Gate Engine</span></div>
      <button type="button" class="project-chip" id="projectChip" data-act="project-menu" aria-haspopup="menu" aria-expanded="false" title="Switch project"><span id="projectName"></span></button>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <div class="tb-right">
      <div class="zoombar" id="zoomBar"></div>
      <div class="gpu-chip" id="gpuChip"><span class="dot"></span><span id="gpuText">Checking GPU…</span></div>
    </div>
  </header>

  <nav class="rail rail-left" aria-label="Tool windows">
    <button class="rail-btn on" id="railExp" title="Explorer" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2.2H19.5A1.5 1.5 0 0 1 21 8.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
    </button>
  </nav>

  <aside class="explorer">
    <div class="panel-head"><span>Explorer</span><span class="head-actions" id="explorerActions"></span></div>
    <div id="tree" class="tree"></div>
  </aside>

  <main class="center">
    <div class="tabs" id="tabs"></div>
    <div class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
      <div id="emptyState" class="empty-state hidden">
        <h3>No plate open</h3>
        <p>Pick a plate in the explorer, or create a new one.</p>
        <button class="btn primary" data-act="new-plate">New plate</button>
      </div>
    </div>
  </main>

  <aside class="palette">
    <div class="panel-head"><span>Components</span></div>
    <div class="search"><input id="paletteSearch" type="search" placeholder="Search components" autocomplete="off" spellcheck="false"></div>
    <div id="paletteList" class="palette-list"></div>
    <div id="inspector" class="inspector"></div>
  </aside>

  <nav class="rail rail-right" aria-label="Tool windows">
    <button class="rail-btn on" id="railPal" title="Components" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
    </button>
  </nav>

  <footer class="statusbar">
    <span id="stProject"></span>
    <span id="stPlate"></span>
    <span id="stCursor"></span>
    <span class="spacer"></span>
    <span class="credit" data-ext="https://www.linkedin.com/in/cvaki-" role="link" tabindex="0" title="Open CVAKI on LinkedIn"><img src="cvaki.png" alt=""><span>Dev <b>CVAKI</b></span></span>
    <span id="stHz" class="mono hidden" title="The clock speed this PC really reaches"></span>
    <span id="stMode">Editing</span>
    <span id="stZoom">100%</span>
  </footer>
</div>

<div id="modalRoot"></div>
<div id="menuRoot"></div>
<div id="toasts"></div>

<script src="js/gates.js"></script>
<script src="js/builtins.js"></script>
<script src="js/sim.js"></script>
<script src="js/storage.js"></script>
<script src="js/editor/helpers.js"></script>
<script src="js/editor/core.js"></script>
<script src="js/editor/lifecycle.js"></script>
<script src="js/editor/history.js"></script>
<script src="js/editor/geometry.js"></script>
<script src="js/editor/render.js"></script>
<script src="js/editor/simulation.js"></script>
<script src="js/editor/pointer.js"></script>
<script src="js/editor/wiring.js"></script>
<script src="js/editor/editing.js"></script>
<script src="js/editor/selection.js"></script>
<script src="js/editor/fill.js"></script>
<script src="js/editor/view.js"></script>
<script src="js/maplayout.js"></script>
<script src="js/mapview.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
